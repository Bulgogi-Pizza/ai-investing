name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:ops
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check
        working-directory: infra/gcp
      - run: terraform init -backend=false
        working-directory: infra/gcp
      - run: terraform validate
        working-directory: infra/gcp
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t investing-smoke .
      - name: Verify one-off setup and scheduled job entries are packaged
        run: docker run --rm --entrypoint sh investing-smoke -c 'test -f /app/src/server/toss-setup.ts && test -f /app/src/jobs/daily-snapshot.ts && test -f /app/src/jobs/morning-calendar.ts && test -f /app/src/jobs/algo-paper.ts && test -f /app/src/lib/algo/paper.ts'
      - name: Verify production startup and private API boundary
        run: |
          docker run -d --name investing-smoke -p 127.0.0.1:8080:8080 -e GOOGLE_CLOUD_PROJECT=ci-placeholder -e APP_ORIGIN=https://ci.example.test investing-smoke
          for attempt in 1 2 3 4 5; do
            if curl --fail http://127.0.0.1:8080/api/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8080/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/portfolio)" = 401
      - if: always()
        run: docker rm -f investing-smoke || true
