name: Deploy GCP
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' && vars.APP_ORIGIN != '' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_BILLING_QUOTA_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: asia-northeast3
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      # AI defaults (user decision 2026-10-21): Claude Sonnet 5.5 on Vertex AI, region global. A
      # repository variable still overrides them (AI_PROVIDER=vertex with a Gemini AI_MODEL selects
      # Gemini). A model id of the wrong family for the provider (for example a stale Gemini
      # AI_MODEL with the default provider) is a configuration error: AI stays off instead of
      # calling the wrong model. Delete or update the old AI_PROVIDER/AI_MODEL variables.
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'vertex-claude' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'claude-sonnet-5-5' }}
      AI_LOCATION: ${{ vars.AI_LOCATION || 'global' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Require production configuration
        run: |
          test -n "$PROJECT"
          test -n "$APP_ORIGIN"
          case "$APP_ORIGIN" in https://*) ;; *) exit 1 ;; esac
      - name: Authenticate container registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build immutable application image
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/ai-investing/app:$REVISION"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)')
          test -n "$DIGEST"
          echo "DEPLOY_IMAGE=$REGION-docker.pkg.dev/$PROJECT/ai-investing/app@$DIGEST" >> "$GITHUB_ENV"
      - name: Deploy verified revision
        id: deploy
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$CURRENT_MAIN" != "$VERIFIED_SHA" ]; then
            echo "A newer main revision exists; skipping stale deployment."
            exit 0
          fi
          gcloud run deploy ai-investing \
            --project="$PROJECT" --region="$REGION" --image="$DEPLOY_IMAGE" \
            --service-account="investing-runtime@$PROJECT.iam.gserviceaccount.com" \
            --port=8080 --cpu=1 --memory=512Mi --min-instances=0 --max-instances=2 \
            --concurrency=40 --timeout=30 --allow-unauthenticated \
            --network=investing-network --subnet=investing-subnet --vpc-egress=all-traffic \
            --update-env-vars="NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT,APP_ORIGIN=$APP_ORIGIN,AI_PROVIDER=$AI_PROVIDER,AI_MODEL=$AI_MODEL,AI_LOCATION=$AI_LOCATION,BUDGET_PUSH_AUDIENCE=$APP_ORIGIN,BUDGET_PUSH_SERVICE_ACCOUNT=investing-budget-push@$PROJECT.iam.gserviceaccount.com" \
            --quiet
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Verify deployment health
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          SERVICE_URL=$(gcloud run services describe ai-investing --region="$REGION" --project="$PROJECT" --format='value(status.url)')
          curl --fail --retry 5 --retry-delay 5 "$SERVICE_URL/api/health"
      # Scheduled jobs run the same verified image digest as the service. Terraform creates the
      # identities and the Cloud Scheduler triggers (docs/operations/jobs.md); this step creates or
      # updates the Cloud Run Job itself.
      - name: Deploy daily snapshot job
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          set -euo pipefail
          JOB=investing-daily-snapshot
          # Reuse the exact numeric secret versions the service is connected to. Nothing is read from
          # Secret Manager here and no secret value ever reaches this workflow.
          SECRETS=$(gcloud run services describe ai-investing --region="$REGION" --project="$PROJECT" --format=json | jq -r '
            [.spec.template.spec.containers[0].env[]?
              | select(.name | IN("TOSS_CLIENT_ID", "TOSS_CLIENT_SECRET", "TOSS_ACCOUNT_SEQ", "TOSS_OWNER_USER_ID"))
              | select(.valueFrom.secretKeyRef != null)
              | "\(.name)=\(.valueFrom.secretKeyRef.name):\(.valueFrom.secretKeyRef.key)"
            ] | sort | join(",")')
          VALID=$(printf '%s' "$SECRETS" | tr ',' '\n' | grep -cE '^TOSS_(CLIENT_ID|CLIENT_SECRET|ACCOUNT_SEQ|OWNER_USER_ID)=investing-toss-[a-z-]+:[0-9]+$' || true)
          if [ "$VALID" != "4" ]; then
            echo "::warning::Toss secrets are not connected to the service with numeric versions yet; skipping job deployment."
            exit 0
          fi
          gcloud run jobs deploy "$JOB" \
            --project="$PROJECT" --region="$REGION" --image="$DEPLOY_IMAGE" \
            --service-account="investing-jobs@$PROJECT.iam.gserviceaccount.com" \
            --command=node --args=--import,tsx,src/jobs/daily-snapshot.ts \
            --set-env-vars="NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT" \
            --set-secrets="$SECRETS" \
            --network=investing-network --subnet=investing-subnet --vpc-egress=all-traffic \
            --max-retries=0 --tasks=1 --parallelism=1 --task-timeout=900s \
            --cpu=1 --memory=512Mi --quiet
          # Least privilege: the scheduler account may start only this job.
          gcloud run jobs add-iam-policy-binding "$JOB" \
            --project="$PROJECT" --region="$REGION" \
            --member="serviceAccount:investing-scheduler@$PROJECT.iam.gserviceaccount.com" \
            --role=roles/run.invoker --quiet >/dev/null
      # Morning calendar job (stage 6b): same image digest, service account and VPC as the snapshot
      # job. FRED/ECOS/Telegram secrets are attached only when the service
      # is connected to them with numeric versions; a missing one only limits what the job can do
      # (recorded as a skipped step), it never blocks the deployment. The AI step is on (Claude Sonnet 5.5,
      # approved 2026-10-21); Toss secrets are attached too so new events get measured market reactions.
      - name: Deploy morning calendar job
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          set -euo pipefail
          JOB=investing-morning-calendar
          # Reuse the exact numeric secret versions the service is connected to; no value is read.
          SECRETS=$(gcloud run services describe ai-investing --region="$REGION" --project="$PROJECT" --format=json | jq -r '
            [.spec.template.spec.containers[0].env[]?
              | select(.name | IN("FRED_API_KEY", "ECOS_API_KEY", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"))
              | select(.valueFrom.secretKeyRef != null)
              | "\(.name)=\(.valueFrom.secretKeyRef.name):\(.valueFrom.secretKeyRef.key)"
              | select(test("^(FRED_API_KEY=investing-fred-api-key|ECOS_API_KEY=investing-ecos-api-key|TELEGRAM_BOT_TOKEN=investing-telegram-bot-token|TELEGRAM_CHAT_ID=investing-telegram-chat-id):[0-9]+$"))
            ] | sort | join(",")')
          for NAME in FRED_API_KEY ECOS_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            case ",$SECRETS," in
              *",$NAME="*) ;;
              *) echo "::warning::$NAME is not connected to the service with a numeric version; the morning job runs without it." ;;
            esac
          done
          # The user approved Claude Sonnet 5.5 (2026-10-21): the AI step is on. It also needs the
          # investing-jobs service account to hold roles/aiplatform.user (terraform morning_ai_enabled)
          # and Vertex quota for the model; without either, the step records AI_AUTH_UNAVAILABLE /
          # AI_QUOTA_PROVIDER and the rest of the morning run is unaffected.
          ENV_VARS="NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT,APP_ORIGIN=$APP_ORIGIN,MORNING_AI_ENABLED=true,AI_PROVIDER=$AI_PROVIDER,AI_MODEL=$AI_MODEL,AI_LOCATION=$AI_LOCATION"
          # Calendar enrichment measures the market reaction with Toss (fixed egress IP): attach the Toss
          # secrets only when the service has all four as numeric versions; without them that part is
          # skipped (TOSS_NOT_CONFIGURED) and everything else still runs.
          TOSS=$(gcloud run services describe ai-investing --region="$REGION" --project="$PROJECT" --format=json | jq -r '
            [.spec.template.spec.containers[0].env[]?
              | select(.name | IN("TOSS_CLIENT_ID", "TOSS_CLIENT_SECRET", "TOSS_ACCOUNT_SEQ", "TOSS_OWNER_USER_ID"))
              | select(.valueFrom.secretKeyRef != null)
              | "\(.name)=\(.valueFrom.secretKeyRef.name):\(.valueFrom.secretKeyRef.key)"
            ] | sort | join(",")')
          TOSS_VALID=$(printf '%s' "$TOSS" | tr ',' '\n' | grep -cE '^TOSS_(CLIENT_ID|CLIENT_SECRET|ACCOUNT_SEQ|OWNER_USER_ID)=investing-toss-[a-z-]+:[0-9]+$' || true)
          if [ "$TOSS_VALID" = "4" ]; then
            if [ -n "$SECRETS" ]; then SECRETS="$SECRETS,$TOSS"; else SECRETS="$TOSS"; fi
          else
            echo "::warning::Toss secrets are not connected to the service with numeric versions; the morning job skips measured market reactions."
          fi
          SECRET_ARGS=()
          if [ -n "$SECRETS" ]; then SECRET_ARGS=(--set-secrets="$SECRETS"); fi
          gcloud run jobs deploy "$JOB" \
            --project="$PROJECT" --region="$REGION" --image="$DEPLOY_IMAGE" \
            --service-account="investing-jobs@$PROJECT.iam.gserviceaccount.com" \
            --command=node --args=--import,tsx,src/jobs/morning-calendar.ts \
            --set-env-vars="$ENV_VARS" \
            "${SECRET_ARGS[@]}" \
            --network=investing-network --subnet=investing-subnet --vpc-egress=all-traffic \
            --max-retries=0 --tasks=1 --parallelism=1 --task-timeout=900s \
            --cpu=1 --memory=512Mi --quiet
          # Least privilege: the scheduler account may start only this job.
          gcloud run jobs add-iam-policy-binding "$JOB" \
            --project="$PROJECT" --region="$REGION" \
            --member="serviceAccount:investing-scheduler@$PROJECT.iam.gserviceaccount.com" \
            --role=roles/run.invoker --quiet >/dev/null
      # Paper (virtual) algorithm run (docs/operations/jobs.md). Same image digest, identity, VPC and
      # Toss secret versions as the snapshot job. Telegram secrets are attached only when the service
      # already has them as numeric versions; without them notifications are recorded as disabled.
      # AI-type algorithms stay off until separately requested: ALGO_AI_ENABLED is set to false explicitly. The market is
      # chosen per execution by the Scheduler (ALGO_MARKET override), and the job places no orders.
      - name: Deploy paper algorithm job
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          set -euo pipefail
          JOB=investing-algo-paper
          SERVICE_JSON=$(gcloud run services describe ai-investing --region="$REGION" --project="$PROJECT" --format=json)
          SECRETS=$(printf '%s' "$SERVICE_JSON" | jq -r '
            [.spec.template.spec.containers[0].env[]?
              | select(.name | IN("TOSS_CLIENT_ID", "TOSS_CLIENT_SECRET", "TOSS_ACCOUNT_SEQ", "TOSS_OWNER_USER_ID"))
              | select(.valueFrom.secretKeyRef != null)
              | "\(.name)=\(.valueFrom.secretKeyRef.name):\(.valueFrom.secretKeyRef.key)"
            ] | sort | join(",")')
          VALID=$(printf '%s' "$SECRETS" | tr ',' '\n' | grep -cE '^TOSS_(CLIENT_ID|CLIENT_SECRET|ACCOUNT_SEQ|OWNER_USER_ID)=investing-toss-[a-z-]+:[0-9]+$' || true)
          if [ "$VALID" != "4" ]; then
            echo "::warning::Toss secrets are not connected to the service with numeric versions yet; skipping paper algorithm job deployment."
            exit 0
          fi
          TELEGRAM=$(printf '%s' "$SERVICE_JSON" | jq -r '
            [.spec.template.spec.containers[0].env[]?
              | select(.name | IN("TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"))
              | select(.valueFrom.secretKeyRef != null)
              | "\(.name)=\(.valueFrom.secretKeyRef.name):\(.valueFrom.secretKeyRef.key)"
            ] | sort | join(",")')
          TELEGRAM_VALID=$(printf '%s' "$TELEGRAM" | tr ',' '\n' | grep -cE '^TELEGRAM_(BOT_TOKEN|CHAT_ID)=investing-telegram-(bot-token|chat-id):[0-9]+$' || true)
          if [ "$TELEGRAM_VALID" = "2" ]; then
            SECRETS="$SECRETS,$TELEGRAM"
          else
            echo "::warning::Telegram secrets are not connected to the service with numeric versions; paper fills will be recorded but not sent."
          fi
          gcloud run jobs deploy "$JOB" \
            --project="$PROJECT" --region="$REGION" --image="$DEPLOY_IMAGE" \
            --service-account="investing-jobs@$PROJECT.iam.gserviceaccount.com" \
            --command=node --args=--import,tsx,src/jobs/algo-paper.ts \
            --set-env-vars="NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT,APP_ORIGIN=$APP_ORIGIN,ALGO_AI_ENABLED=false,AI_PROVIDER=$AI_PROVIDER,AI_MODEL=$AI_MODEL,AI_LOCATION=$AI_LOCATION" \
            --set-secrets="$SECRETS" \
            --network=investing-network --subnet=investing-subnet --vpc-egress=all-traffic \
            --max-retries=0 --tasks=1 --parallelism=1 --task-timeout=900s \
            --cpu=1 --memory=512Mi --quiet
          # Least privilege: the scheduler account may start only this job (and the snapshot job above).
          gcloud run jobs add-iam-policy-binding "$JOB" \
            --project="$PROJECT" --region="$REGION" \
            --member="serviceAccount:investing-scheduler@$PROJECT.iam.gserviceaccount.com" \
            --role=roles/run.invoker --quiet >/dev/null
      # Live (REAL ORDER) algorithm run, stage 7f (docs/operations/jobs.md). Same image digest, identity,
      # VPC and Toss secret versions as the paper job, plus the Telegram secrets (the job refuses to
      # run without working alerts). LIVE_TRADING_ENABLED is set on THIS job only, from the repository
      # variable of the same name (absent or not "true" => "false"): it is the deployment kill switch
      # the job checks before doing anything. Changing the variable takes effect with the next deploy.
      # AI-type algorithms stay off until separately requested: ALGO_AI_ENABLED=false. The Cloud Scheduler triggers (infra/gcp/jobs-live.tf) are
      # created paused; deploying this job does not start anything.
      - name: Deploy live algorithm job
        if: steps.deploy.outputs.deployed == 'true'
        env:
          # Repository variable LIVE_TRADING_ENABLED (Settings > Variables). Anything but the exact
          # string "true", including an absent variable, deploys the job with the switch OFF.
          LIVE_FLAG: ${{ vars.LIVE_TRADING_ENABLED == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          JOB=investing-algo-live
          SERVICE_JSON=$(gcloud run services describe ai-investing --region="$REGION" --project="$PROJECT" --format=json)
          SECRETS=$(printf '%s' "$SERVICE_JSON" | jq -r '
            [.spec.template.spec.containers[0].env[]?
              | select(.name | IN("TOSS_CLIENT_ID", "TOSS_CLIENT_SECRET", "TOSS_ACCOUNT_SEQ", "TOSS_OWNER_USER_ID"))
              | select(.valueFrom.secretKeyRef != null)
              | "\(.name)=\(.valueFrom.secretKeyRef.name):\(.valueFrom.secretKeyRef.key)"
            ] | sort | join(",")')
          VALID=$(printf '%s' "$SECRETS" | tr ',' '\n' | grep -cE '^TOSS_(CLIENT_ID|CLIENT_SECRET|ACCOUNT_SEQ|OWNER_USER_ID)=investing-toss-[a-z-]+:[0-9]+$' || true)
          if [ "$VALID" != "4" ]; then
            echo "::warning::Toss secrets are not connected to the service with numeric versions yet; skipping live algorithm job deployment."
            exit 0
          fi
          TELEGRAM=$(printf '%s' "$SERVICE_JSON" | jq -r '
            [.spec.template.spec.containers[0].env[]?
              | select(.name | IN("TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"))
              | select(.valueFrom.secretKeyRef != null)
              | "\(.name)=\(.valueFrom.secretKeyRef.name):\(.valueFrom.secretKeyRef.key)"
            ] | sort | join(",")')
          TELEGRAM_VALID=$(printf '%s' "$TELEGRAM" | tr ',' '\n' | grep -cE '^TELEGRAM_(BOT_TOKEN|CHAT_ID)=investing-telegram-(bot-token|chat-id):[0-9]+$' || true)
          if [ "$TELEGRAM_VALID" = "2" ]; then
            SECRETS="$SECRETS,$TELEGRAM"
          else
            echo "::warning::Telegram secrets are not connected to the service with numeric versions; the live job will refuse to run (alerts are a required safeguard)."
          fi
          gcloud run jobs deploy "$JOB" \
            --project="$PROJECT" --region="$REGION" --image="$DEPLOY_IMAGE" \
            --service-account="investing-jobs@$PROJECT.iam.gserviceaccount.com" \
            --command=node --args=--import,tsx,src/jobs/algo-live.ts \
            --set-env-vars="NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT,APP_ORIGIN=$APP_ORIGIN,ALGO_AI_ENABLED=false,AI_PROVIDER=$AI_PROVIDER,AI_MODEL=$AI_MODEL,AI_LOCATION=$AI_LOCATION,LIVE_TRADING_ENABLED=$LIVE_FLAG" \
            --set-secrets="$SECRETS" \
            --network=investing-network --subnet=investing-subnet --vpc-egress=all-traffic \
            --max-retries=0 --tasks=1 --parallelism=1 --task-timeout=900s \
            --cpu=1 --memory=512Mi --quiet
          # Least privilege: the scheduler account may start only the jobs it needs; this is one of them.
          gcloud run jobs add-iam-policy-binding "$JOB" \
            --project="$PROJECT" --region="$REGION" \
            --member="serviceAccount:investing-scheduler@$PROJECT.iam.gserviceaccount.com" \
            --role=roles/run.invoker --quiet >/dev/null
      # One-off READ-ONLY order API access check (design "주문 권한 확인" step 1). It only reads
      # buying power, commissions and open orders and places nothing. No schedule and no invoker
      # grant: the operator runs it by hand (gcloud run jobs execute). It has no kill-switch flag because it cannot place orders.
      - name: Deploy order access check job
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          set -euo pipefail
          JOB=investing-order-access-check
          SECRETS=$(gcloud run services describe ai-investing --region="$REGION" --project="$PROJECT" --format=json | jq -r '
            [.spec.template.spec.containers[0].env[]?
              | select(.name | IN("TOSS_CLIENT_ID", "TOSS_CLIENT_SECRET", "TOSS_ACCOUNT_SEQ", "TOSS_OWNER_USER_ID"))
              | select(.valueFrom.secretKeyRef != null)
              | "\(.name)=\(.valueFrom.secretKeyRef.name):\(.valueFrom.secretKeyRef.key)"
            ] | sort | join(",")')
          VALID=$(printf '%s' "$SECRETS" | tr ',' '\n' | grep -cE '^TOSS_(CLIENT_ID|CLIENT_SECRET|ACCOUNT_SEQ|OWNER_USER_ID)=investing-toss-[a-z-]+:[0-9]+$' || true)
          if [ "$VALID" != "4" ]; then
            echo "::warning::Toss secrets are not connected to the service with numeric versions yet; skipping order access check job deployment."
            exit 0
          fi
          gcloud run jobs deploy "$JOB" \
            --project="$PROJECT" --region="$REGION" --image="$DEPLOY_IMAGE" \
            --service-account="investing-jobs@$PROJECT.iam.gserviceaccount.com" \
            --command=node --args=--import,tsx,src/jobs/order-access-check.ts \
            --set-env-vars="NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT" \
            --set-secrets="$SECRETS" \
            --network=investing-network --subnet=investing-subnet --vpc-egress=all-traffic \
            --max-retries=0 --tasks=1 --parallelism=1 --task-timeout=300s \
            --cpu=1 --memory=512Mi --quiet
      # Calendar enrichment (manual): Korean titles, outcome/impact/explainer by Claude Sonnet 5.5 and
      # measured market reactions from Toss for every registered event. Same image digest, identity,
      # VPC (fixed egress IP) and Toss secret versions as the jobs above; FRED/ECOS secrets are attached
      # when the service has them (rate-decision facts), without them those facts are simply absent.
      # No schedule and no invoker grant: the operator runs it by hand (gcloud run jobs execute), and
      # the morning job enriches new events every day. It places no orders.
      - name: Deploy calendar enrichment job
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          set -euo pipefail
          JOB=investing-calendar-enrich
          SERVICE_JSON=$(gcloud run services describe ai-investing --region="$REGION" --project="$PROJECT" --format=json)
          SECRETS=$(printf '%s' "$SERVICE_JSON" | jq -r '
            [.spec.template.spec.containers[0].env[]?
              | select(.name | IN("TOSS_CLIENT_ID", "TOSS_CLIENT_SECRET", "TOSS_ACCOUNT_SEQ", "TOSS_OWNER_USER_ID"))
              | select(.valueFrom.secretKeyRef != null)
              | "\(.name)=\(.valueFrom.secretKeyRef.name):\(.valueFrom.secretKeyRef.key)"
            ] | sort | join(",")')
          VALID=$(printf '%s' "$SECRETS" | tr ',' '\n' | grep -cE '^TOSS_(CLIENT_ID|CLIENT_SECRET|ACCOUNT_SEQ|OWNER_USER_ID)=investing-toss-[a-z-]+:[0-9]+$' || true)
          if [ "$VALID" != "4" ]; then
            echo "::warning::Toss secrets are not connected to the service with numeric versions yet; skipping calendar enrichment job deployment."
            exit 0
          fi
          MACRO=$(printf '%s' "$SERVICE_JSON" | jq -r '
            [.spec.template.spec.containers[0].env[]?
              | select(.name | IN("FRED_API_KEY", "ECOS_API_KEY"))
              | select(.valueFrom.secretKeyRef != null)
              | "\(.name)=\(.valueFrom.secretKeyRef.name):\(.valueFrom.secretKeyRef.key)"
              | select(test("^(FRED_API_KEY=investing-fred-api-key|ECOS_API_KEY=investing-ecos-api-key):[0-9]+$"))
            ] | sort | join(",")')
          if [ -n "$MACRO" ]; then SECRETS="$SECRETS,$MACRO"; else echo "::warning::FRED/ECOS secrets are not connected to the service with numeric versions; rate-decision facts are skipped."; fi
          gcloud run jobs deploy "$JOB" \
            --project="$PROJECT" --region="$REGION" --image="$DEPLOY_IMAGE" \
            --service-account="investing-jobs@$PROJECT.iam.gserviceaccount.com" \
            --command=node --args=--import,tsx,src/jobs/calendar-enrich.ts \
            --set-env-vars="NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT,CALENDAR_AI_ENABLED=true,AI_PROVIDER=$AI_PROVIDER,AI_MODEL=$AI_MODEL,AI_LOCATION=$AI_LOCATION" \
            --set-secrets="$SECRETS" \
            --network=investing-network --subnet=investing-subnet --vpc-egress=all-traffic \
            --max-retries=0 --tasks=1 --parallelism=1 --task-timeout=1800s \
            --cpu=1 --memory=512Mi --quiet
